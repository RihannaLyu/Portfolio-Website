<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 500" width="280" height="500">
  <!-- Software cart: a low rolling computer cart (cream CRT showing a computer desktop, keyboard,
       HTML / CSS / JS books, floppy disks, a succulent), painted with the same watercolor
       filter as the noteboard so it sits with the hand-painted wall objects. -->
  <defs>
    <filter id="wc" x="-6%" y="-4%" width="112%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="4" xChannelSelector="R" yChannelSelector="G" result="paint"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="grain"/>
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 -1.2 0.6" result="specks"/>
      <feComposite in="specks" in2="paint" operator="in" result="speckPaint"/>
      <feBlend in="paint" in2="speckPaint" mode="multiply" result="grained"/>
      <feGaussianBlur in="grained" stdDeviation="0.35"/>
    </filter>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4e"/><stop offset="0.5" stop-color="#a8692f"/><stop offset="1" stop-color="#7d4a1e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55565c"/><stop offset="0.45" stop-color="#8d8e95"/><stop offset="1" stop-color="#45464b"/>
    </linearGradient>
    <linearGradient id="casing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecdc"/><stop offset="0.6" stop-color="#e8dac2"/><stop offset="1" stop-color="#d3c1a3"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9ea"/><stop offset="1" stop-color="#f4c9cf"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="petal" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z"/>
  </defs>

  <g filter="url(#wc)">
    <!-- ── frame: two metal posts ── -->
    <rect x="24" y="236" width="9" height="236" rx="3" fill="url(#metal)"/>
    <rect x="247" y="236" width="9" height="236" rx="3" fill="url(#metal)"/>

    <!-- ── CRT monitor ── -->
    <path d="M106 212 L174 212 L186 238 L94 238 Z" fill="#cdbb9c" stroke="#6b5440" stroke-width="2.5"/>
    <rect x="30" y="18" width="220" height="196" rx="22" fill="url(#casing)" stroke="#6b5440" stroke-width="3"/>
    <path d="M42 26 Q140 16 238 26" stroke="#fffaf0" stroke-width="3" fill="none" opacity="0.7"/>
    <rect x="50" y="38" width="180" height="144" rx="16" fill="#3b2b23"/>
    <rect x="58" y="46" width="164" height="128" rx="11" fill="url(#screen)"/>
    <!-- the screen: a computer desktop. A soft wallpaper with the season flower, desktop icons,
         one open app window (the Color Studio), and a dock along the bottom. -->
    <g transform="translate(176 98) scale(0.5)" stroke="#6b3a48" stroke-width="1.2" fill-opacity="0.55">
      <use href="#petal" transform="rotate(0)"   fill="#F96E46"/><use href="#petal" transform="rotate(30)"  fill="#F4D35E"/>
      <use href="#petal" transform="rotate(60)"  fill="#9BC53D"/><use href="#petal" transform="rotate(90)"  fill="#3AB7D0"/>
      <use href="#petal" transform="rotate(120)" fill="#9A7FB5"/><use href="#petal" transform="rotate(150)" fill="#C06C84"/>
      <use href="#petal" transform="rotate(180)" fill="#E0A23A"/><use href="#petal" transform="rotate(210)" fill="#B5472E"/>
      <use href="#petal" transform="rotate(240)" fill="#7A1F2B"/><use href="#petal" transform="rotate(270)" fill="#2338A8"/>
      <use href="#petal" transform="rotate(300)" fill="#D1006F"/><use href="#petal" transform="rotate(330)" fill="#F2A3B5"/>
      <circle r="10" fill="#F6D58E" fill-opacity="0.7"/>
    </g>
    <!-- menu bar -->
    <rect x="58" y="46" width="164" height="10" rx="5" fill="#fbeef0" opacity="0.92"/>
    <rect x="58" y="51" width="164" height="5" fill="#fbeef0" opacity="0.92"/>
    <circle cx="66" cy="51" r="2.2" fill="#6b5440"/>
    <rect x="72" y="49.5" width="14" height="3" rx="1.5" fill="#b7a39a"/><rect x="90" y="49.5" width="10" height="3" rx="1.5" fill="#b7a39a"/>
    <rect x="200" y="49.5" width="16" height="3" rx="1.5" fill="#8b7a72"/>
    <!-- desktop icons: folders + a file -->
    <g stroke="#8a6a1c" stroke-width="0.9">
      <path d="M64 64 h7 l2 2 h9 v11 h-18 Z" fill="#f2cf6b"/>
      <path d="M64 86 h7 l2 2 h9 v11 h-18 Z" fill="#a9cfe8" stroke="#4a7fa8"/>
      <path d="M64 108 h7 l2 2 h9 v11 h-18 Z" fill="#f2b5c4" stroke="#b0566f"/>
      <path d="M66 129 h11 l4 4 v13 h-15 Z" fill="#ffffff" stroke="#8a8172"/>
    </g>
    <g fill="#ffffff" opacity="0.9">
      <rect x="62" y="79" width="22" height="3" rx="1.5"/><rect x="62" y="101" width="22" height="3" rx="1.5"/>
      <rect x="62" y="123" width="22" height="3" rx="1.5"/><rect x="62" y="148" width="22" height="3" rx="1.5"/>
    </g>
    <!-- an open app window -->
    <rect x="98" y="66" width="78" height="62" rx="5" fill="#fffaf6" stroke="#b7a39a" stroke-width="1.2"/>
    <rect x="98" y="66" width="78" height="10" rx="5" fill="#f3dfe2"/>
    <rect x="98" y="71" width="78" height="5" fill="#f3dfe2"/>
    <circle cx="104" cy="71" r="1.8" fill="#e8708a"/><circle cx="110" cy="71" r="1.8" fill="#f2c25c"/><circle cx="116" cy="71" r="1.8" fill="#8cc79a"/>
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M108 92 h0.1" stroke="#F96E46"/><path d="M118 92 h0.1" stroke="#F4D35E"/><path d="M128 92 h0.1" stroke="#9BC53D"/>
      <path d="M138 92 h0.1" stroke="#3AB7D0"/><path d="M148 92 h0.1" stroke="#9A7FB5"/><path d="M158 92 h0.1" stroke="#C06C84"/>
    </g>
    <rect x="106" y="102" width="44" height="4" rx="2" fill="#d9c9c2"/><rect x="106" y="111" width="32" height="4" rx="2" fill="#e5d8d2"/>
    <rect x="150" y="110" width="20" height="10" rx="5" fill="#e8708a"/>
    <!-- dock -->
    <rect x="86" y="156" width="108" height="14" rx="6" fill="#fffaf6" opacity="0.72" stroke="#ffffff" stroke-width="0.8"/>
    <g stroke="#6b5440" stroke-width="0.6">
      <rect x="92" y="159" width="8" height="8" rx="2" fill="#f2cf6b"/><rect x="104" y="159" width="8" height="8" rx="2" fill="#3AB7D0"/>
      <rect x="116" y="159" width="8" height="8" rx="2" fill="#e8708a"/><rect x="128" y="159" width="8" height="8" rx="2" fill="#9BC53D"/>
      <rect x="140" y="159" width="8" height="8" rx="2" fill="#9A7FB5"/><rect x="152" y="159" width="8" height="8" rx="2" fill="#F96E46"/>
      <rect x="164" y="159" width="8" height="8" rx="2" fill="#ffffff"/><rect x="176" y="159" width="8" height="8" rx="2" fill="#2338A8"/>
    </g>
    <path d="M168 116 L168 136 L173 131 L177 139 L180 137 L176 129 L183 129 Z" fill="#fff" stroke="#3b2b23" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="58" y="46" width="164" height="128" rx="11" fill="url(#glass)"/>
    <path d="M176 196 H220 M176 202 H220" stroke="#b5a283" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="232" cy="199" r="3.5" fill="#7fd08f"/>
    <!-- sticky note on the casing corner -->
    <g transform="translate(206 10) rotate(10)">
      <rect x="2" y="3" width="42" height="40" fill="#3b2410" opacity="0.18"/>
      <rect width="42" height="40" fill="#a9dcbf" stroke="#5f9d7a" stroke-width="1.3"/>
      <path d="M12 14 L6 20 L12 26 M30 14 L36 20 L30 26 M24 11 L18 29" stroke="#2f6b4b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ── top shelf (monitor) ── -->
    <rect x="12" y="236" width="256" height="14" rx="3" fill="url(#wood)" stroke="#5e371a" stroke-width="2"/>
    <path d="M18 240 H262" stroke="#e0a970" stroke-width="2" opacity="0.6"/>

    <!-- cable down to the keyboard -->
    <path d="M196 250 C 212 276, 190 292, 206 316" stroke="#3b3b40" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- ── middle shelf: keyboard + mouse ── -->
    <path d="M46 344 L222 344 L213 318 L55 318 Z" fill="#efe4d1" stroke="#6b5440" stroke-width="2.3" stroke-linejoin="round"/>
    <g fill="#d8c8ad" stroke="#9c8868" stroke-width="0.8">
      <rect x="62" y="322" width="14" height="6" rx="1.5"/><rect x="80" y="322" width="14" height="6" rx="1.5"/><rect x="98" y="322" width="14" height="6" rx="1.5"/><rect x="116" y="322" width="14" height="6" rx="1.5"/><rect x="134" y="322" width="14" height="6" rx="1.5"/><rect x="152" y="322" width="14" height="6" rx="1.5"/><rect x="170" y="322" width="14" height="6" rx="1.5"/><rect x="188" y="322" width="18" height="6" rx="1.5"/>
      <rect x="58" y="331" width="15" height="6" rx="1.5"/><rect x="77" y="331" width="15" height="6" rx="1.5"/><rect x="96" y="331" width="15" height="6" rx="1.5"/><rect x="115" y="331" width="15" height="6" rx="1.5"/><rect x="134" y="331" width="15" height="6" rx="1.5" fill="#f2a3b5"/><rect x="153" y="331" width="15" height="6" rx="1.5"/><rect x="172" y="331" width="15" height="6" rx="1.5"/><rect x="191" y="331" width="19" height="6" rx="1.5"/>
    </g>
    <ellipse cx="238" cy="335" rx="9" ry="9" fill="#efe4d1" stroke="#6b5440" stroke-width="2"/>
    <path d="M238 326 V334" stroke="#9c8868" stroke-width="1.4"/>
    <rect x="12" y="344" width="256" height="13" rx="3" fill="url(#wood)" stroke="#5e371a" stroke-width="2"/>
    <path d="M18 348 H262" stroke="#e0a970" stroke-width="2" opacity="0.6"/>

    <!-- ── bottom shelf: books lying flat (HTML / CSS / JS), floppy disks, a succulent ── -->
    <g font-family="Georgia, serif" font-weight="700" font-size="12" letter-spacing="2" text-anchor="middle">
      <rect x="46" y="432" width="112" height="20" rx="2" fill="#c2416b" stroke="#6e1f3a" stroke-width="2"/>
      <text x="102" y="446.5" fill="#fff7ec">HTML</text>
      <rect x="52" y="413" width="102" height="19" rx="2" fill="#8fb39b" stroke="#3e6650" stroke-width="2"/>
      <text x="103" y="427" fill="#f3fbf5">CSS</text>
      <rect x="58" y="395" width="92" height="18" rx="2" fill="#e9c46a" stroke="#8a6a1c" stroke-width="2"/>
      <text x="104" y="408.5" fill="#5a4410">JS</text>
    </g>
    <path d="M86 395 L92 375 L104 375 L110 395 Z" fill="#c8673f" stroke="#7a3518" stroke-width="1.8"/>
    <g fill="#7fb07a" stroke="#3f6b3c" stroke-width="1.4">
      <path d="M98 375 C92 364 94 354 98 348 C102 354 104 364 98 375 Z"/>
      <path d="M98 375 C87 370 83 362 83 356 C91 358 96 366 98 375 Z"/>
      <path d="M98 375 C109 370 113 362 113 356 C105 358 100 366 98 375 Z"/>
    </g>
    <rect x="176" y="436" width="64" height="16" rx="2" fill="#5f86b8" stroke="#2f4f7d" stroke-width="2"/>
    <rect x="172" y="420" width="64" height="16" rx="2" fill="#f3a9bd" stroke="#a8455c" stroke-width="2"/>
    <rect x="178" y="404" width="64" height="16" rx="2" fill="#f6d86b" stroke="#a68420" stroke-width="2"/>
    <rect x="212" y="407" width="20" height="10" rx="1" fill="#fff8e6" opacity="0.85"/>
    <rect x="206" y="423" width="20" height="10" rx="1" fill="#fff8e6" opacity="0.85"/>
    <rect x="210" y="439" width="20" height="10" rx="1" fill="#fff8e6" opacity="0.85"/>
    <rect x="12" y="452" width="256" height="14" rx="3" fill="url(#wood)" stroke="#5e371a" stroke-width="2"/>
    <path d="M18 456 H262" stroke="#e0a970" stroke-width="2" opacity="0.6"/>

    <!-- ── casters ── -->
    <rect x="24" y="466" width="9" height="10" fill="#3a3a3e"/>
    <rect x="247" y="466" width="9" height="10" fill="#3a3a3e"/>
    <circle cx="28.5" cy="484" r="12" fill="#2a2a2d" stroke="#141416" stroke-width="2"/>
    <circle cx="28.5" cy="484" r="4" fill="#8a8a90"/>
    <circle cx="251.5" cy="484" r="12" fill="#2a2a2d" stroke="#141416" stroke-width="2"/>
    <circle cx="251.5" cy="484" r="4" fill="#8a8a90"/>
  </g>
</svg>
