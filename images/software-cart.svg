<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 740" width="280" height="740">
  <!-- Software cart: a little rolling computer cart (cream CRT showing a flower, keyboard,
       HTML / CSS / JS books, floppy disks, a succulent), painted with the same watercolor
       filter as the noteboard so it sits with the hand-painted wall objects. -->
  <defs>
    <filter id="wc" x="-6%" y="-3%" width="112%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="5" xChannelSelector="R" yChannelSelector="G" result="paint"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="grain"/>
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 -1.2 0.6" result="specks"/>
      <feComposite in="specks" in2="paint" operator="in" result="speckPaint"/>
      <feBlend in="paint" in2="speckPaint" mode="multiply" result="grained"/>
      <feGaussianBlur in="grained" stdDeviation="0.35"/>
    </filter>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86f3e"/><stop offset="0.5" stop-color="#8a5629"/><stop offset="1" stop-color="#673d1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b2e"/><stop offset="0.45" stop-color="#5a5a60"/><stop offset="1" stop-color="#232326"/>
    </linearGradient>
    <linearGradient id="casing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecdc"/><stop offset="0.6" stop-color="#e8dac2"/><stop offset="1" stop-color="#d3c1a3"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9ea"/><stop offset="1" stop-color="#f4c9cf"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#wc)">
    <!-- ── frame: two metal posts ── -->
    <rect x="22" y="250" width="11" height="456" rx="3" fill="url(#metal)"/>
    <rect x="247" y="250" width="11" height="456" rx="3" fill="url(#metal)"/>

    <!-- ── CRT monitor ── -->
    <path d="M104 220 L176 220 L190 250 L90 250 Z" fill="#cdbb9c" stroke="#6b5440" stroke-width="2.5"/>
    <rect x="28" y="28" width="224" height="198" rx="24" fill="url(#casing)" stroke="#6b5440" stroke-width="3"/>
    <path d="M40 36 Q140 26 240 36" stroke="#fffaf0" stroke-width="3" fill="none" opacity="0.7"/>
    <rect x="50" y="48" width="180" height="146" rx="16" fill="#3b2b23"/>
    <rect x="58" y="56" width="164" height="130" rx="11" fill="url(#screen)"/>
    <!-- browser bar -->
    <rect x="58" y="56" width="164" height="17" rx="9" fill="#f9dfe2"/>
    <rect x="58" y="66" width="164" height="7" fill="#f9dfe2"/>
    <circle cx="70" cy="64.5" r="3.3" fill="#e8708a"/><circle cx="81" cy="64.5" r="3.3" fill="#f2c25c"/><circle cx="92" cy="64.5" r="3.3" fill="#8cc79a"/>
    <rect x="104" y="61" width="104" height="7" rx="3.5" fill="#fff6f4"/>
    <!-- the flower on screen (one petal per season) -->
    <g transform="translate(140 126)">
      <g fill-opacity="0.95" stroke="#6b3a48" stroke-width="0.8">
        <path transform="rotate(0)"   d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#F96E46"/>
        <path transform="rotate(30)"  d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#F4D35E"/>
        <path transform="rotate(60)"  d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#9BC53D"/>
        <path transform="rotate(90)"  d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#3AB7D0"/>
        <path transform="rotate(120)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#9A7FB5"/>
        <path transform="rotate(150)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#C06C84"/>
        <path transform="rotate(180)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#E0A23A"/>
        <path transform="rotate(210)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#B5472E"/>
        <path transform="rotate(240)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#7A1F2B"/>
        <path transform="rotate(270)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#2338A8"/>
        <path transform="rotate(300)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#D1006F"/>
        <path transform="rotate(330)" d="M0 -9 C8 -18 9 -32 0 -40 C-9 -32 -8 -18 0 -9 Z" fill="#F2A3B5"/>
      </g>
      <circle r="10" fill="#F6D58E" stroke="#6b3a48" stroke-width="1"/>
    </g>
    <!-- cursor -->
    <path d="M178 150 L178 170 L183 165 L187 173 L190 171 L186 163 L193 163 Z" fill="#fff" stroke="#3b2b23" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="58" y="56" width="164" height="130" rx="11" fill="url(#glass)"/>
    <!-- casing details: vents, power light, heart sticker -->
    <path d="M176 206 H220 M176 212 H220" stroke="#b5a283" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="232" cy="209" r="3.5" fill="#7fd08f"/>
    <path d="M52 200 c-5 -7 -14 -2 -9 5 l9 8 l9 -8 c5 -7 -4 -12 -9 -5 z" fill="#e8708a" stroke="#a8455c" stroke-width="1.2" transform="rotate(-12 52 205)"/>
    <!-- sticky note on the casing corner -->
    <g transform="translate(206 18) rotate(10)">
      <rect x="2" y="3" width="44" height="42" fill="#3b2410" opacity="0.18"/>
      <rect width="44" height="42" fill="#a9dcbf" stroke="#5f9d7a" stroke-width="1.3"/>
      <path d="M12 15 L6 21 L12 27 M32 15 L38 21 L32 27 M25 12 L19 30" stroke="#2f6b4b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ── top shelf ── -->
    <rect x="10" y="248" width="260" height="16" rx="4" fill="url(#wood)" stroke="#3f2410" stroke-width="2.5"/>
    <path d="M16 252 H264" stroke="#c48a55" stroke-width="2" opacity="0.6"/>

    <!-- cable drooping from the monitor down to the keyboard -->
    <path d="M196 262 C 214 300, 186 320, 206 352" stroke="#3b3b40" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- ── keyboard on the middle shelf ── -->
    <path d="M44 384 L236 384 L226 352 L54 352 Z" fill="#efe4d1" stroke="#6b5440" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#d8c8ad" stroke="#9c8868" stroke-width="0.8">
      <rect x="62" y="357" width="15" height="7" rx="1.5"/><rect x="81" y="357" width="15" height="7" rx="1.5"/><rect x="100" y="357" width="15" height="7" rx="1.5"/><rect x="119" y="357" width="15" height="7" rx="1.5"/><rect x="138" y="357" width="15" height="7" rx="1.5"/><rect x="157" y="357" width="15" height="7" rx="1.5"/><rect x="176" y="357" width="15" height="7" rx="1.5"/><rect x="195" y="357" width="20" height="7" rx="1.5"/>
      <rect x="58" y="367" width="16" height="7" rx="1.5"/><rect x="78" y="367" width="16" height="7" rx="1.5"/><rect x="98" y="367" width="16" height="7" rx="1.5"/><rect x="118" y="367" width="16" height="7" rx="1.5"/><rect x="138" y="367" width="16" height="7" rx="1.5" fill="#f2a3b5"/><rect x="158" y="367" width="16" height="7" rx="1.5"/><rect x="178" y="367" width="16" height="7" rx="1.5"/><rect x="198" y="367" width="20" height="7" rx="1.5"/>
      <rect x="86" y="377" width="108" height="5" rx="1.5"/>
    </g>
    <rect x="10" y="384" width="260" height="15" rx="4" fill="url(#wood)" stroke="#3f2410" stroke-width="2.5"/>
    <path d="M16 388 H264" stroke="#c48a55" stroke-width="2" opacity="0.6"/>
    <!-- mouse hanging off the shelf on its cord -->
    <path d="M236 378 C 262 380, 268 410, 262 446" stroke="#3b3b40" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="262" cy="460" rx="11" ry="15" fill="#efe4d1" stroke="#6b5440" stroke-width="2.2"/>
    <path d="M262 446 V458" stroke="#9c8868" stroke-width="1.5"/>

    <!-- ── bottom shelf: HTML / CSS / JS books, floppy disks, a succulent ── -->
    <g>
      <rect x="44" y="494" width="30" height="150" rx="3" fill="#c2416b" stroke="#6e1f3a" stroke-width="2.2"/>
      <rect x="74" y="508" width="28" height="136" rx="3" fill="#8fb39b" stroke="#3e6650" stroke-width="2.2"/>
      <g transform="translate(104 516) rotate(6 14 64)">
        <rect width="27" height="128" rx="3" fill="#e9c46a" stroke="#8a6a1c" stroke-width="2.2"/>
      </g>
      <g font-family="Georgia, serif" font-weight="700" font-size="15" fill="#fff7ec" letter-spacing="1.5">
        <text transform="translate(64 610) rotate(-90)">HTML</text>
        <text transform="translate(93 604) rotate(-90)" fill="#f3fbf5">CSS</text>
        <text transform="translate(125 596) rotate(-84)" fill="#5a4410">JS</text>
      </g>
      <path d="M44 512 H74 M44 626 H74 M74 524 H102 M74 628 H102" stroke="#fff" stroke-width="1.6" opacity="0.45"/>
    </g>
    <g>
      <rect x="150" y="624" width="84" height="18" rx="2" fill="#5f86b8" stroke="#2f4f7d" stroke-width="2"/>
      <rect x="146" y="606" width="84" height="18" rx="2" fill="#f3a9bd" stroke="#a8455c" stroke-width="2"/>
      <rect x="152" y="588" width="84" height="18" rx="2" fill="#f6d86b" stroke="#a68420" stroke-width="2"/>
      <rect x="196" y="591" width="26" height="12" rx="1" fill="#fff8e6" opacity="0.85"/>
      <rect x="190" y="609" width="26" height="12" rx="1" fill="#fff8e6" opacity="0.85"/>
      <rect x="194" y="627" width="26" height="12" rx="1" fill="#fff8e6" opacity="0.85"/>
      <!-- succulent in a little terracotta pot -->
      <path d="M170 588 L206 588 L201 566 L175 566 Z" fill="#c8673f" stroke="#7a3518" stroke-width="2"/>
      <rect x="172" y="562" width="32" height="7" rx="2" fill="#d9814f" stroke="#7a3518" stroke-width="1.8"/>
      <g fill="#7fb07a" stroke="#3f6b3c" stroke-width="1.5">
        <path d="M188 562 C180 548 182 536 188 528 C194 536 196 548 188 562 Z"/>
        <path d="M188 562 C174 556 168 546 168 538 C178 540 186 550 188 562 Z"/>
        <path d="M188 562 C202 556 208 546 208 538 C198 540 190 550 188 562 Z"/>
        <path d="M188 562 C178 560 172 556 170 552 C178 550 184 554 188 562 Z" fill="#96c48c"/>
      </g>
    </g>
    <rect x="10" y="642" width="260" height="16" rx="4" fill="url(#wood)" stroke="#3f2410" stroke-width="2.5"/>
    <path d="M16 646 H264" stroke="#c48a55" stroke-width="2" opacity="0.6"/>

    <!-- ── casters ── -->
    <g>
      <rect x="23" y="702" width="9" height="12" fill="#3a3a3e"/>
      <rect x="248" y="702" width="9" height="12" fill="#3a3a3e"/>
      <circle cx="27.5" cy="722" r="14" fill="#2a2a2d" stroke="#141416" stroke-width="2"/>
      <circle cx="27.5" cy="722" r="5" fill="#8a8a90"/>
      <circle cx="252.5" cy="722" r="14" fill="#2a2a2d" stroke="#141416" stroke-width="2"/>
      <circle cx="252.5" cy="722" r="5" fill="#8a8a90"/>
    </g>
  </g>
</svg>
