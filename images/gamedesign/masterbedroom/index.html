<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Master Bedroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,500&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../world/world.css?v=2" />
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js"
  } }
  </script>
</head>
<!-- Shirley's master suite from Second Chance (Unity scene: SampleScene / masterroom), walkable -->
<body data-demo="../../3Dmodels/masterbedroom.mp4" data-island="bedroomIsland" data-v="2">
  <canvas id="world" aria-label="Master Bedroom, a walkable 3D room"></canvas>

  <div class="dd-load" id="ddLoad">
    <div class="dd-load-card">
      <h1>Master Bedroom</h1>
      <div class="dd-bar"><i id="ddBar"></i></div>
      <p id="ddLoadText">unlocking the suite…</p>
    </div>
  </div>

  <header class="dd-title"><h1>Master Bedroom</h1></header>
  <button class="dd-demo" id="ddDemo" type="button">demo ▶</button>
  <p class="dd-hint" id="ddHint"></p>
  <div class="dd-stick" id="ddStick" aria-hidden="true"><i id="ddKnob"></i></div>

  <div class="dd-video" id="ddVideo" hidden>
    <button class="dd-video-close" id="ddVideoClose" type="button" aria-label="Close">✕</button>
    <video id="ddVideoEl" playsinline controls preload="none" poster="../../3Dmodels/masterbedroom.jpg"></video>
  </div>

  <script type="module" src="../world/world.js?v=16"></script>
</body>
</html>
