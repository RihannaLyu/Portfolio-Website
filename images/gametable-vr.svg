<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1689 1608" width="1689" height="1608">
  <!-- VR set for the game shelf, drawn on the same 1689×1608 canvas as gametable.PNG so it lies
       exactly on top: a white VR headset resting on the console (middle shelf), with one
       controller beside it, and a glowing "VR" sticker on the shelf's leg. -->
  <defs>
    <filter id="wc" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="15" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="7" xChannelSelector="R" yChannelSelector="G" result="paint"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="5" result="grain"/>
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 -1.2 0.5" result="specks"/>
      <feComposite in="specks" in2="paint" operator="in" result="speckPaint"/>
      <feBlend in="paint" in2="speckPaint" mode="multiply"/>
    </filter>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#cfd0d8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c38"/><stop offset="1" stop-color="#121218"/>
    </linearGradient>
  </defs>

  <g filter="url(#wc)">
    <!-- headset, resting on top of the console -->
    <ellipse cx="1150" cy="848" rx="190" ry="12" fill="#1a1410" opacity="0.25"/>
    <!-- strap looping behind -->
    <path d="M985 790 C 960 700, 1340 700, 1316 790" fill="none" stroke="#6e6f7a" stroke-width="26" stroke-linecap="round"/>
    <path d="M985 790 C 960 700, 1340 700, 1316 790" fill="none" stroke="#9fa0aa" stroke-width="10" stroke-linecap="round"/>
    <!-- body -->
    <rect x="968" y="738" width="364" height="110" rx="42" fill="url(#shell)" stroke="#6e6f7a" stroke-width="5"/>
    <rect x="992" y="756" width="316" height="72" rx="30" fill="url(#visor)"/>
    <path d="M1010 770 Q 1150 750 1290 770" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.25"/>
    <!-- tracking cameras -->
    <g fill="#3a3a46" stroke="#8a8b96" stroke-width="3">
      <circle cx="1022" cy="806" r="10"/><circle cx="1278" cy="806" r="10"/><circle cx="1110" cy="812" r="7"/><circle cx="1190" cy="812" r="7"/>
    </g>
    <circle cx="1150" cy="794" r="6" fill="#7ff0f0"/>

    <!-- one controller lying beside it on the console -->
    <g transform="rotate(-12 1440 812)">
      <circle cx="1440" cy="790" r="44" fill="none" stroke="#e8e9ef" stroke-width="16"/>
      <circle cx="1440" cy="790" r="44" fill="none" stroke="#8a8b96" stroke-width="3"/>
      <rect x="1424" y="820" width="32" height="40" rx="14" fill="url(#shell)" stroke="#6e6f7a" stroke-width="4"/>
    </g>

    <!-- glowing "VR" sticker on the shelf's left leg -->
    <g transform="translate(840 1180) rotate(-4)">
      <rect x="-6" y="0" width="64" height="40" rx="8" fill="#1c1c24" stroke="#7ff0f0" stroke-width="4"/>
      <text x="26" y="29" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#7ff0f0">VR</text>
    </g>
  </g>
</svg>
