<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}svg{display:block}</style></head>
<body>
<!-- HOUSE FINISH — one watercolor treatment for every drawing added to the wall, so they read in the
     same hand as the original paintings: soft wobbling edges, warm lifted ink instead of black outlines,
     blotchy pigment washes, pooled colour at the edges, and paper grain. -->
<svg id="s" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="house" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- 1. the hand: a slow wobble, plus a finer ragged edge -->
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="3" result="lo"/>
      <feDisplacementMap in="SourceGraphic" in2="lo" scale="9" xChannelSelector="R" yChannelSelector="G" result="w1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="8" result="hi"/>
      <feDisplacementMap in="w1" in2="hi" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="wob"/>
      <!-- 2. ink: lift pure black to a warm sepia so outlines read as pencil + pigment, not cartoon -->
      <feComponentTransfer in="wob" result="ink">
        <feFuncR type="table" tableValues="0.30 0.62 1"/>
        <feFuncG type="table" tableValues="0.22 0.56 0.98"/>
        <feFuncB type="table" tableValues="0.17 0.50 0.94"/>
      </feComponentTransfer>
      <feColorMatrix in="ink" type="saturate" values="0.88" result="sat"/>
      <!-- 3. wash: uneven pigment, the paint pooling and thinning across each shape -->
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="21" result="blot"/>
      <feColorMatrix in="blot" type="matrix" values="0.30 0 0 0 0.79  0.30 0 0 0 0.775  0.30 0 0 0 0.76  0 0 0 0 1" result="blotG"/>
      <feComposite in="blotG" in2="wob" operator="in" result="blotA"/>
      <feBlend in="sat" in2="blotA" mode="multiply" result="washed"/>
      <!-- 4. pooled pigment along the silhouette -->
      <feMorphology in="wob" operator="erode" radius="4" result="inner"/>
      <feComposite in="wob" in2="inner" operator="out" result="ring"/>
      <feGaussianBlur in="ring" stdDeviation="2.4" result="ringB"/>
      <feColorMatrix in="ringB" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0.30 0" result="pool"/>
      <feComposite in="pool" in2="wob" operator="in" result="poolIn"/>
      <feBlend in="washed" in2="poolIn" mode="multiply" result="pooled"/>
      <!-- 5. cold-press paper grain -->
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="5" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0.24 0 0 0 0.82  0.24 0 0 0 0.81  0.24 0 0 0 0.80  0 0 0 0 1" result="grainG"/>
      <feComposite in="grainG" in2="wob" operator="in" result="grainA"/>
      <feBlend in="pooled" in2="grainA" mode="multiply" result="grained"/>
      <!-- 6. soften the vector crispness -->
      <feGaussianBlur in="grained" stdDeviation="0.7" result="soft"/>
      <feComposite in="soft" in2="wob" operator="in"/>
    </filter>
  </defs>
  <image id="im" x="0" y="0" filter="url(#house)"/>
</svg>
<script>
  const q = new URLSearchParams(location.search), w = +q.get('w'), h = +q.get('h');
  const s = document.getElementById('s'), im = document.getElementById('im');
  s.setAttribute('width', w); s.setAttribute('height', h);
  im.setAttribute('width', w); im.setAttribute('height', h);
  im.setAttribute('href', q.get('src'));
  // each asset can carry its own strength (the same recipe, dialled for size)
  // ink=charcoal: dark objects (screens, bezels) lift to a cool soft charcoal, as the track lights are painted
  if (q.get('ink') === 'charcoal') {
    const t = { R: '0.13 0.55 1', G: '0.13 0.53 0.98', B: '0.15 0.52 0.95' };
    for (const c in t) document.querySelector('#house feFunc' + c).setAttribute('tableValues', t[c]);
    document.querySelector('#house feColorMatrix[type=saturate]').setAttribute('values', '0.92');
  }
</script>
</body></html>
